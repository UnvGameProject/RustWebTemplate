[package]
name = "topcoat-poc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
default-run = "topcoat-poc"

[dependencies]
topcoat = { version = "=0.9.0", features = ["tower"] }
tokio = { version = "1.51.1", features = ["rt-multi-thread", "macros"] }

sqlx = { version = "=0.9.0", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "migrate",
    "uuid",
    "time",
] }

uuid = { version = "=1.26.1", features = ["v4"] }
time = "=0.3.55"
input-policy-macros = { path = "crates/input-policy-macros" }
garde = { version = "=0.23.0", features = ["derive", "email"] }
ammonia = "=4.2.0"
argon2 = "=0.6.0"

[dev-dependencies]
trybuild = "=1.0.121"