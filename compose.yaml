services:
  postgres:
    image: postgres:18.6-bookworm
    init: true
    environment:
      POSTGRES_DB: topcoat_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
      - postgres_migrator_password
      - postgres_app_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
  assets:
    image: node:24.21.0-bookworm-slim
    init: true
    working_dir: /workspace
    command: ["sh", "/workspace/assets/scripts/dev-assets.sh"]
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /workspace/generated/app.css && test -s /workspace/generated/bootstrap.bundle.min.js"
        ]
      interval: 1s
      timeout: 2s
      retries: 60

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      assets:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: /cargo-target

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_app_password
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/cargo-target

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: [ "cargo", "run", "--locked", "--bin", "migrate" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: /cargo-target

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_migrator
      DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets:
      - postgres_migrator_password
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/cargo-target

  rusty:
    build:
      context: .
      dockerfile: tools/rusty-cli/Dockerfile
    init: true
    working_dir: /workspace
    command: [ "sleep", "infinity" ]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUSTY_PROJECT_ROOT: /workspace

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_migrator
      DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets:
      - postgres_migrator_password
    volumes:
      - .:/workspace
    healthcheck:
      test: [ "CMD", "rusty", "--version" ]
      interval: 5s
      timeout: 3s
      retries: 10

secrets:
  postgres_bootstrap_password:
    file: ./.secrets/postgres_bootstrap_password

  postgres_migrator_password:
    file: ./.secrets/postgres_migrator_password

  postgres_app_password:
    file: ./.secrets/postgres_app_password

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  cargo-target:
  node-modules:
