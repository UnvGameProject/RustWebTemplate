services:
  postgres:
    image: postgres:18.6-bookworm
    init: true
    environment:
      POSTGRES_DB: topcoat_poc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_bootstrap_password
    secrets:
      - postgres_bootstrap_password
      - postgres_migrator_password
      - postgres_app_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  postgres-test:
    profiles: ["test"]
    image: postgres:18.6-bookworm
    init: true
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: topcoat_test_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_test_password
    secrets:
      - postgres_test_password
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
        ]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql
    networks:
      - test-database

  assets:
    image: node:24.21.0-bookworm-slim
    init: true
    working_dir: /workspace
    tmpfs:
      - /workspace/.secrets
    command: ["sh", "/workspace/assets/scripts/dev-assets.sh"]
    volumes:
      - .:/workspace
      - node-modules:/workspace/node_modules
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /workspace/generated/app.css && test -s /workspace/generated/bootstrap.bundle.min.js"
        ]
      interval: 1s
      timeout: 2s
      retries: 60

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: ["topcoat", "dev", "--bin", "topcoat-poc"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      assets:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: /app/target

      # Topcoat dev rebuilds must use checked-in SQLx query metadata.
      # Online metadata generation is handled separately by ./sqlx-cache.
      SQLX_OFFLINE: "true"

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_app
      DB_PASSWORD_FILE: /run/secrets/postgres_app_password
    secrets:
      - postgres_app_password
    ports:
      - "127.0.0.1:3000:3000"
    tmpfs:
      - /app/.secrets
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/app/target

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    command: ["cargo", "run", "--locked", "--bin", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: /cargo-target

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_migrator
      DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets:
      - postgres_migrator_password
    tmpfs:
      - /app/.secrets
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/cargo-target

  rusty:
    build:
      context: .
      dockerfile: tools/rusty-cli/Dockerfile
    init: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RUSTY_PROJECT_ROOT: /workspace

      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: topcoat_poc
      DB_USER: topcoat_migrator
      DB_PASSWORD_FILE: /run/secrets/postgres_migrator_password
    secrets:
      - postgres_migrator_password
    tmpfs:
      - /workspace/.secrets
    volumes:
      - .:/workspace
    healthcheck:
      test: ["CMD", "rusty", "--version"]
      interval: 5s
      timeout: 3s
      retries: 10

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.dev
    init: true
    depends_on:
      postgres-test:
        condition: service_healthy
    environment:
      APP_ENV: testing
      RUST_BACKTRACE: 1
      CARGO_TARGET_DIR: /cargo-test-target

      # Compile-time SQLx macros must use checked-in .sqlx metadata.
      # DATABASE_URL is constructed by docker/test/run.sh for runtime
      # #[sqlx::test] database creation.
      SQLX_OFFLINE: "true"

      DB_HOST: postgres-test
      DB_PORT: "5432"
      DB_NAME: postgres
      DB_USER: topcoat_test_admin
      DB_PASSWORD_FILE: /run/secrets/postgres_test_password
    secrets:
      - postgres_test_password
    tmpfs:
      - /app/.secrets
    volumes:
      - .:/app
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-test-target:/cargo-test-target
    networks:
      - test-database
    command: ["sh", "/app/docker/test/run.sh"]

secrets:
  postgres_bootstrap_password:
    file: ./.secrets/postgres_bootstrap_password

  postgres_migrator_password:
    file: ./.secrets/postgres_migrator_password

  postgres_app_password:
    file: ./.secrets/postgres_app_password

  postgres_test_password:
    file: ./.secrets/postgres_test_password

networks:
  test-database:

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  cargo-target:
  cargo-test-target:
  node-modules: